[project]
name = "traceguard"
version = "0.1.0"
description = "TraceGuard AI - ML component (transaction & mule-account risk scoring)"
requires-python = ">=3.11"
dependencies = ["networkx>=3.2", "pandas>=2.1", "numpy>=1.26", "scikit-learn>=1.4", "scipy>=1.11", "joblib>=1.3", "pydantic>=2.5"]

[tool.setuptools]
packages = ["traceguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
